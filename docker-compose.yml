# Local development infrastructure. Apps run on the host with `pnpm dev`.
name: inbetween

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: inbetween
      POSTGRES_PASSWORD: inbetween
      POSTGRES_DB: inbetween
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inbetween -d inbetween']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for listing, inspection and KYC uploads.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333']
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data

  # Catches all outgoing email in development. UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  s3-data:
