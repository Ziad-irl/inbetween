name: Bug report
description: Something is broken
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the locale (ar/en), device and browser if it's a UI bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, shared, database, payments, infra, docs]
